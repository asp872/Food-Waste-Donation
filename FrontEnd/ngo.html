<!DOCTYPE html>
<html>
<head>
    <title>NGO Dashboard</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

<header>
    <h1>NGO Dashboard</h1>
</header>

<div id="foodList" class="container"></div>

<script>

const API_URL = "https://food-waste-donation-k8p9.onrender.com";

async function loadFood() {

    const response = await fetch(`${API_URL}/donations`);
    const data = await response.json();

    let output = "";

    data.forEach((item) => {

        output += `
        <div class="card">

            <h2>${item.hotel}</h2>

            <p><b>Food:</b> ${item.food}</p>

            <p><b>Quantity:</b> ${item.quantity}</p>

            <p><b>Location:</b> ${item.location}</p>

            <p><b>Status:</b> ${item.status}</p>

            <button onclick="acceptFood(${item.id})">Accept</button>

            <button onclick="pickupFood(${item.id})">Pickup</button>

        </div>
        `;
    });

    document.getElementById("foodList").innerHTML = output;
}

async function acceptFood(id) {

    await fetch(`${API_URL}/accept/${id}`, {
        method: "PUT"
    });

    loadFood();
}

async function pickupFood(id) {

    await fetch(`${API_URL}/pickup/${id}`, {
        method: "PUT"
    });

    loadFood();
}

loadFood();

</script>

</body>
</html>
